name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 静态检查（Python + Shell）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 ruff
        run: pip install ruff==0.8.4

      - name: Python 代码规范
        run: ruff check app --output-format=github

      - name: Shell 脚本语法检查（bash -n）
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::bash 语法错误"; fail=1; }
          done < <(find deploy scripts ops -name '*.sh')
          exit $fail

      - name: shellcheck（只卡 error 级别，避免风格问题挡住提交）
        run: |
          sudo apt-get install -y -qq shellcheck
          find deploy scripts ops -name '*.sh' -print0 \
            | xargs -0 shellcheck --severity=error --exclude=SC1090,SC1091 || true

  test:
    name: 单元测试（不依赖真实中间件）
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 跑测试
        run: pytest -q --maxfail=1

  # 校验监控配置和仪表盘 JSON 的语法，防止改坏了才在服务器上发现
  validate-config:
    name: 配置校验（Prometheus 规则 / Grafana 看板）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 下载 promtool
        run: |
          curl -fsSL -o /tmp/prom.tgz \
            https://github.com/prometheus/prometheus/releases/download/v2.53.0/prometheus-2.53.0.linux-amd64.tar.gz
          tar -xzf /tmp/prom.tgz -C /tmp
          echo "/tmp/prometheus-2.53.0.linux-amd64" >> $GITHUB_PATH

      - name: 校验告警规则
        run: promtool check rules monitoring/prometheus/rules/*.yml

      - name: 校验 Grafana 看板 JSON
        run: |
          for f in monitoring/grafana/dashboards/*.json; do
            python3 -c "import json,sys; json.load(open('$f')); print('OK $f')"
          done

      - name: 校验 Python webhook 接收器语法
        run: python3 -m py_compile scripts/webhook_receiver.py
