# Grafana 数据源自动配置：Grafana 启动时自动读取，不用手动点页面
# 这是「基础设施即代码」的体现：看板和数据源都能 git 管、能重建
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus        # 看板里用固定 uid 引用，避免导入后失效
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      # 用 Prometheus 的实例标签做看板变量
      httpMethod: POST
